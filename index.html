<!DOCTYPE html>
<html>
<head>
    <!-- Write HTML below here -->
    <title>Navigation Bar</title>

    <link rel="stylesheet" href="styles.css">
</head>
    <body>
        <!-- Write HTML code here -->
        <div id="main-container">
