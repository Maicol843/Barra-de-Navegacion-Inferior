<!--
LISTA ORDENADA Y TITULO

Vamos a crear una lista para añadir iconos a la barra de navegación.
Dentro de la etiqueta nav,
1. Crea una etiqueta de lista desordenada <ul>.
2. Añade el title (Atributo) “Navigation Bar” a la lista desordenada.
-->

<!DOCTYPE html>
<html>
<head>
    <!-- Write HTML below here -->
    <title>Navigation Bar</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
    <body>
        <!-- Write HTML code here -->
        <div id="main-container">
            <nav class="navigation">
                <ul title="Navigation Bar"></ul>
            </nav>
        </div>
    </body>
</html>
